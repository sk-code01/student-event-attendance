<div class="notification-bell" data-notification-bell>
  <button
    type="button"
    class="icon-btn"
    (click)="toggle(); $event.stopPropagation()"
    [attr.aria-expanded]="open()"
    aria-haspopup="true"
    [attr.aria-label]="unreadCount() > 0 ? unreadCount() + ' unread notifications' : 'Notifications'"
  >
    <app-icon name="bell" style="width: 1.125rem; height: 1.125rem" />
    @if (unreadCount() > 0) {
      <span class="icon-btn-badge" aria-hidden="true">{{ unreadCount() }}</span>
    }
  </button>

  @if (open()) {
    <div class="notification-panel" role="dialog" aria-label="Notification centre">
      <div class="notification-panel-head">
        <span class="section-title mb-0">Notifications</span>
        <div class="d-flex gap-2 align-items-center">
          @if (unreadCount() > 0) {
            <button type="button" class="btn btn-link btn-sm p-0" (click)="markAllRead()">
              Mark all read
            </button>
          }
          <button type="button" class="btn-close btn-sm" aria-label="Close notifications" (click)="close()"></button>
        </div>
      </div>

      <div class="notification-panel-body">
        @if (errorMessage()) {
          <p class="alert alert-danger py-2 small m-3" role="alert">{{ errorMessage() }}</p>
        }

        @if (loading()) {
          <div class="p-3">
            <span class="skeleton skeleton-text"></span>
            <span class="skeleton skeleton-text"></span>
            <span class="skeleton skeleton-text"></span>
          </div>
        } @else if (recent().length === 0) {
          <p class="text-muted small m-0 p-4 text-center">No notifications yet.</p>
        } @else {
          <ul class="notification-list">
            @for (notification of recent(); track notification.id) {
              <li>
                <button
                  type="button"
                  class="notification-item"
                  [class.is-unread]="!notification.is_read"
                  (click)="openNotification(notification)"
                >
                  <span class="notification-item-head">
                    <span class="notification-item-title">{{ notification.title }}</span>
                    @if (!notification.is_read) {
                      <span class="badge text-bg-primary">New</span>
                    }
                  </span>
                  <span class="notification-item-text">{{ notification.message }}</span>
                  <span class="notification-item-time">{{ notification.created_at | date: 'short' }}</span>
                </button>
              </li>
            }
          </ul>
        }
      </div>

      <div class="notification-panel-foot">
        <a routerLink="/notifications" class="small" (click)="close()">View all notifications</a>
      </div>
    </div>
  }
</div>
