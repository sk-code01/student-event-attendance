[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
testpaths = apps tests
; Neon's connection pooler can hold a server-side session open after the
; client disconnects, which blocks DROP DATABASE during test teardown.
; Reusing the test database avoids create/drop entirely; run
; `pytest --create-db` once after changing models to force a rebuild.
addopts = --reuse-db
